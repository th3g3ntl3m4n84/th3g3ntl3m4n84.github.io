<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write-up | Joao Paulo Figueiredo Guedes</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <nav>
        <a href="index.html">Home</a>
        <a href="writeups.html">← Write-ups</a>
      </nav>
    </header>

    <main class="writeup-content" id="content">
      <a href="writeups.html" class="back-link">← Back to write-ups</a>
      <div id="markdown-body"></div>
      <div id="loading">Loading...</div>
      <div id="error" style="display: none; color: #ff6b6b;"></div>
    </main>

    <footer>
      <p><a href="index.html" style="color: var(--cyan); text-decoration: none;">Joao Paulo Figueiredo Guedes</a></p>
    </footer>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var platform = params.get('platform'); // htb | vulnlab | offsec
      var slug = params.get('slug');

      var base = '';
      // GitHub Pages: if site is at username.github.io/repo-name/, base = /repo-name/
      var pathname = window.location.pathname;
      if (pathname.indexOf('/writeup.html') !== -1) {
        var pathParts = pathname.split('/').filter(Boolean);
        if (pathParts.length > 1) base = '/' + pathParts.slice(0, -1).join('/') + '/';
      }

      var platformPath = 'writeups/' + platform + '/';
      var slugPath = slug + '.md';
      var subfolderPath = platformPath + slug + '/' + slug + '.md';
      var flatPath = platformPath + slugPath;
      var imageBase = base + platformPath;

      var loadingEl = document.getElementById('loading');
      var errorEl = document.getElementById('error');
      var bodyEl = document.getElementById('markdown-body');

      if (!platform || !slug) {
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.textContent = 'Invalid parameters. Use: writeup.html?platform=htb|vulnlab|offsec&slug=filename';
        return;
      }

      function loadAndRender(mdPath, imgBase) {
        return fetch(base + mdPath).then(function (r) {
          if (!r.ok) throw new Error('File not found: ' + mdPath);
          return r.text();
        }).then(function (md) {
          loadingEl.style.display = 'none';
          marked.setOptions({ gfm: true, breaks: true });
          var html = marked.parse(md);
          bodyEl.innerHTML = html.replace(
            /<img([^>]+)src=["']([^"']+)["']/gi,
            function (_, attrs, src) {
              if (src.startsWith('http') || src.startsWith('//') || src.startsWith('data:')) return '<img' + attrs + 'src="' + src + '"';
              var resolved = src.startsWith('/') ? src : imgBase + (src.startsWith('images/') ? src : 'images/' + src);
              return '<img' + attrs + 'src="' + resolved + '"';
            }
          );
        });
      }

      fetch(base + subfolderPath)
        .then(function (r) {
          if (r.ok) {
            imageBase = base + platformPath + slug + '/';
            return loadAndRender(subfolderPath, imageBase);
          }
          return loadAndRender(flatPath, imageBase);
        })
        .catch(function (err) {
          loadingEl.style.display = 'none';
          errorEl.style.display = 'block';
          errorEl.textContent = err.message || 'Error loading write-up.';
        });
    })();
  </script>
</body>
</html>
